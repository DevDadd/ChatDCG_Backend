
syntax = "proto3";

package chat;


service ChatService {
  // No x-user-id needed: these return the id to send on every other call
  rpc Register (RegisterRequest)
      returns (AuthResponse);

  rpc Login (LoginRequest)
      returns (AuthResponse);

  // Marks the caller offline and ends their open streams on every device
  rpc Logout (LogoutRequest)
      returns (LogoutResponse);

  rpc GetUsersStatus (GetUsersStatusRequest)
      returns (GetUsersStatusResponse);

  rpc GetConversationHistory (GetConversationHistoryRequest)
      returns (GetConversationHistoryResponse);

  rpc SendMessage (SendMessageRequest)
      returns (SendMessageResponse);

  rpc SendTypingStatus (SendTypingStatusRequest)
      returns (SendTypingStatusResponse);

  rpc SubscribeTyping (SubscribeTypingRequest)
      returns (stream TypingEvent);

  rpc StreamMessages (StreamMessagesRequest)
      returns (stream ChatMessage);

  rpc SyncMessages (stream SendMessageRequest)
      returns (SyncMessagesResponse);

  rpc Chat (stream ChatClientMessage)
      returns (stream ChatMessage);

  // Open right after Login/Register and keep open while the app runs: the
  // caller stays online while it is open, and receives other users'
  // online/offline changes.
  rpc Presence (PresenceRequest)
      returns (stream PresenceEvent);
}


message RegisterRequest {
  string account = 1;
  string password = 2;
  // Optional: default to account
  string username = 3;
  string display_name = 4;
}

message LoginRequest {
  string account = 1;
  string password = 2;
}

message LogoutRequest {
}

message LogoutResponse {
  bool success = 1;
}

message UserInfo {
  int64 id = 1;
  string account = 2;
  string username = 3;
  string display_name = 4;
}

message AuthResponse {
  UserInfo user = 1;
}

message GetUsersStatusRequest {
}

message UserStatus {
  int64 user_id = 1;
  string username = 2;
  string display_name = 3;
  bool is_online = 4;
  string last_seen = 5;
}

message GetUsersStatusResponse {
  repeated UserStatus users = 1;
}

message GetConversationHistoryRequest {
  int64 other_user_id = 1;
}

message GetConversationHistoryResponse {
  repeated ChatMessage messages = 1;
  int32 total_count = 2;
}

message SendMessageRequest {
  int64 conversation_id = 1;
  int64 sender_id = 2;
  string content = 3;
  // Unix ms when the user wrote the message; used by SyncMessages so offline
  // messages keep their original order. 0 = use server time.
  int64 client_timestamp_ms = 4;
}

message SendMessageResponse {
  bool success = 1;
  string message = 2;
  int64 message_id = 3;
}

message SendTypingStatusRequest {
  int64 conversation_id = 1;
  int64 user_id = 2;
  bool is_typing = 3;
}

message SendTypingStatusResponse {
  bool success = 1;
}

message SubscribeTypingRequest {
  int64 conversation_id = 1;
  int64 user_id = 2;
}

message TypingEvent {
  int64 conversation_id = 1;
  int64 user_id = 2;
  string username = 3;
  string display_name = 4;
  bool is_typing = 5;
  string timestamp = 6;
}

message ChatMessage {
  int64 message_id = 1;
  int64 conversation_id = 2;
  int64 sender_id = 3;
  string sender_name = 4;
  string content = 5;
  string timestamp = 6;
}

message StreamMessagesRequest {
  int64 conversation_id = 1;
  int64 user_id = 2;
}

message SyncMessagesResponse {
  int32 received_count = 1;
  int32 failed_count = 2;
  string message = 3;
}

message ChatClientMessage {
  int64 conversation_id = 1;
  int64 sender_id = 2;
  string content = 3;
}

message PresenceRequest {
}

message PresenceEvent {
  int64 user_id = 1;
  bool is_online = 2;
  string last_seen = 3;
}
