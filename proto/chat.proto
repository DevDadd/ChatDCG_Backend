
syntax = "proto3";

package chat;


service ChatService {
  rpc GetUsersStatus (GetUsersStatusRequest)
      returns (GetUsersStatusResponse);

  rpc SendMessage (SendMessageRequest)
      returns (SendMessageResponse);

  rpc SendTypingStatus (SendTypingStatusRequest)
      returns (SendTypingStatusResponse);

  rpc SubscribeTyping (SubscribeTypingRequest)
      returns (stream TypingEvent);
}


message GetUsersStatusRequest {
}

message UserStatus {
  int32 user_id = 1;
  string username = 2;
  string display_name = 3;
  bool is_online = 4;
  string last_seen = 5;
}

message GetUsersStatusResponse {
  repeated UserStatus users = 1;
}

message SendMessageRequest {
  int32 conversation_id = 1;
  int32 sender_id = 2;
  string content = 3;
}

message SendMessageResponse {
  bool success = 1;
  string message = 2;
  int32 message_id = 3;
}

message SendTypingStatusRequest {
  int32 conversation_id = 1;
  int32 user_id = 2;
  bool is_typing = 3;
}

message SendTypingStatusResponse {
  bool success = 1;
}

message SubscribeTypingRequest {
  int32 conversation_id = 1;
  int32 user_id = 2;
}

message TypingEvent {
  int32 conversation_id = 1;
  int32 user_id = 2;
  string username = 3;
  string display_name = 4;
  bool is_typing = 5;
  string timestamp = 6;
}
